<template>
    <section aria-labelledby="analytics-heading">
        <header><div><h1 id="analytics-heading">Appointment Dashboard</h1><p>Operational performance for the current calendar month.</p></div><lightning-button-icon icon-name="utility:refresh" alternative-text="Refresh appointment analytics" onclick={load}></lightning-button-icon></header>
        <template lwc:if={loading}><div class="loading" role="status"><lightning-spinner size="small" alternative-text="Loading appointment analytics"></lightning-spinner></div></template>
        <template lwc:elseif={error}><p class="error" role="alert">{error}</p></template>
        <template lwc:else>
            <div class="grid" aria-label="Appointment key performance indicators">
                <article><strong>{data.appointmentsThisMonth}</strong><span>Appointments this month</span></article>
                <article><strong>{data.upcomingNext7Days}</strong><span>Upcoming next 7 days</span></article>
                <article><strong>{data.completionRate}%</strong><span>Completion rate</span></article>
                <article><strong>{data.cancellationRate}%</strong><span>Cancellation rate</span></article>
                <article><strong>{data.noShowRate}%</strong><span>No-show rate</span></article>
            </div>
            <div class="breakdowns">
                <section class="panel status-panel" aria-labelledby="status-heading">
                    <h2 id="status-heading">Appointment status</h2>
                    <div class="donut-layout">
                        <div class="donut" style={statusPieStyle} role="img" aria-label={statusChartLabel}><div><strong>{statusTotal}</strong><span>Total</span></div></div>
                        <div class="legend"><template for:each={statusRows} for:item="row"><div class="legend-row" key={row.label}><i style={row.swatchStyle}></i><span>{row.label}</span><strong>{row.value}</strong></div></template></div>
                    </div>
                </section>
                <section class="panel" aria-labelledby="resource-heading"><h2 id="resource-heading">Appointments by resource</h2><template for:each={resourceRows} for:item="row"><div class="bar-row" key={row.label}><div><span>{row.label}</span><strong>{row.value}</strong></div><div class="track"><span style={row.style}></span></div></div></template></section>
                <section class="panel" aria-labelledby="location-heading"><h2 id="location-heading">Appointments by location</h2><template for:each={locationRows} for:item="row"><div class="bar-row" key={row.label}><div><span>{row.label}</span><strong>{row.value}</strong></div><div class="track"><span style={row.style}></span></div></div></template></section>
                <section class="panel" aria-labelledby="user-heading"><h2 id="user-heading">Appointments by booking user</h2><template for:each={bookingUserRows} for:item="row"><div class="bar-row" key={row.label}><div><span>{row.label}</span><strong>{row.value}</strong></div><div class="track"><span style={row.style}></span></div></div></template></section>
                <section class="panel" aria-labelledby="service-heading"><h2 id="service-heading">Appointments by service</h2><template for:each={serviceRows} for:item="row"><div class="bar-row" key={row.label}><div><span>{row.label}</span><strong>{row.value}</strong></div><div class="track"><span style={row.style}></span></div></div></template></section>
                <section class="panel" aria-labelledby="source-heading"><h2 id="source-heading">Appointments by booking source</h2><template for:each={bookingSourceRows} for:item="row"><div class="bar-row" key={row.label}><div><span>{row.label}</span><strong>{row.value}</strong></div><div class="track"><span style={row.style}></span></div></div></template></section>
            </div>
        </template>
        <c-ladmin-ai-smart-insights></c-ladmin-ai-smart-insights>
    </section>
</template>
