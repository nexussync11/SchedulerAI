<template>
    <section aria-labelledby="analytics-heading">
        <header><div><h1 id="analytics-heading">Appointment Dashboard</h1><p>Operational performance for the selected period. Select any result to inspect its appointments.</p></div><lightning-button-icon icon-name="utility:refresh" alternative-text="Refresh appointment analytics" onclick={load}></lightning-button-icon></header>
        <div class="date-filters"><lightning-input type="date" label="From" data-field="startDate" value={startDate} onchange={changeDate}></lightning-input><lightning-input type="date" label="To" data-field="endDate" value={endDate} onchange={changeDate}></lightning-input><lightning-button label="Apply dates" variant="brand" onclick={applyDates}></lightning-button><lightning-button label="Export selected report" onclick={exportCsv} disabled={exportDisabled}></lightning-button></div>
        <template lwc:if={loading}><div class="loading"><lightning-spinner size="small" alternative-text="Loading appointment analytics"></lightning-spinner></div></template>
        <template lwc:elseif={error}><p class="error" role="alert">{error}</p></template>
        <template lwc:else>
            <div class="grid" aria-label="Appointment key performance indicators">
                <button class="kpi" data-dimension="all" data-label="Appointments in period" onclick={drilldown}><strong>{data.appointmentsThisMonth}</strong><span>Appointments in period</span><small>{comparisonLabel}</small></button>
                <button class="kpi" data-dimension="upcoming" data-label="Upcoming next 7 days" onclick={drilldown}><strong>{data.upcomingNext7Days}</strong><span>Upcoming next 7 days</span></button>
                <button class="kpi" data-dimension="status" data-value="Completed" data-label="Completed appointments" onclick={drilldown}><strong>{data.completionRate}%</strong><span>Completion rate</span></button>
                <button class="kpi" data-dimension="status" data-value="Cancelled" data-label="Cancelled appointments" onclick={drilldown}><strong>{data.cancellationRate}%</strong><span>Cancellation rate</span></button>
                <button class="kpi" data-dimension="status" data-value="No Show" data-label="No-show appointments" onclick={drilldown}><strong>{data.noShowRate}%</strong><span>No-show rate</span></button>
            </div>
            <div class="breakdowns">
                <section class="panel status-panel"><h2>Appointment status</h2><div class="donut-layout"><button class="donut" style={statusPieStyle} data-dimension="all" data-label="All appointment statuses" onclick={drilldown} aria-label={statusChartLabel}><span class="donut-centre"><strong>{statusTotal}</strong><span>Total</span></span></button><div class="legend"><template for:each={statusRows} for:item="row"><button class="legend-row report-link" key={row.label} data-dimension="status" data-value={row.label} data-label={row.label} onclick={drilldown}><i style={row.swatchStyle}></i><span>{row.label}</span><strong>{row.value}</strong></button></template></div></div></section>
                <section class="panel"><h2>Appointments by resource</h2><template for:each={resourceRows} for:item="row"><button class="bar-row report-link" key={row.label} data-dimension="resource" data-value={row.label} data-label={row.label} onclick={drilldown}><span class="bar-label"><span>{row.label}</span><strong>{row.value}</strong></span><span class="track"><span style={row.style}></span></span></button></template></section>
                <section class="panel"><h2>Appointments by location</h2><template for:each={locationRows} for:item="row"><button class="bar-row report-link" key={row.label} data-dimension="location" data-value={row.label} data-label={row.label} onclick={drilldown}><span class="bar-label"><span>{row.label}</span><strong>{row.value}</strong></span><span class="track"><span style={row.style}></span></span></button></template></section>
                <section class="panel"><h2>Appointments by booking user</h2><template for:each={bookingUserRows} for:item="row"><button class="bar-row report-link" key={row.label} data-dimension="user" data-value={row.label} data-label={row.label} onclick={drilldown}><span class="bar-label"><span>{row.label}</span><strong>{row.value}</strong></span><span class="track"><span style={row.style}></span></span></button></template></section>
                <section class="panel"><h2>Appointments by service</h2><template for:each={serviceRows} for:item="row"><button class="bar-row report-link" key={row.label} data-dimension="service" data-value={row.label} data-label={row.label} onclick={drilldown}><span class="bar-label"><span>{row.label}</span><strong>{row.value}</strong></span><span class="track"><span style={row.style}></span></span></button></template></section>
                <section class="panel"><h2>Appointments by booking source</h2><template for:each={bookingSourceRows} for:item="row"><button class="bar-row report-link" key={row.label} data-dimension="source" data-value={row.label} data-label={row.label} onclick={drilldown}><span class="bar-label"><span>{row.label}</span><strong>{row.value}</strong></span><span class="track"><span style={row.style}></span></span></button></template></section>
            </div>
        </template>
        <c-ladmin-ai-smart-insights></c-ladmin-ai-smart-insights>
        <section class="details" aria-labelledby="details-heading">
            <div class="details-heading"><div><p class="eyebrow">Report details</p><h2 id="details-heading">{detailTitle}</h2></div><span>{detailRows.length} records</span></div>
            <template lwc:if={detailLoading}><div class="loading"><lightning-spinner size="small" alternative-text="Loading appointment details"></lightning-spinner></div></template>
            <template lwc:elseif={detailError}><p class="error" role="alert">{detailError}</p></template>
            <template lwc:elseif={hasDetails}>
                <div class="table-scroll"><table><thead><tr><th>Appointment</th><th>Customer</th><th>Resource</th><th>Location</th><th>Service</th><th>Booked by</th><th>Source</th><th>Date &amp; time</th><th>Status</th></tr></thead><tbody><template for:each={pagedRows} for:item="row"><tr key={row.id}><td><a href={row.url} target="_blank">{row.subject}</a><small>{row.name}</small></td><td>{row.customer}</td><td>{row.resource}</td><td>{row.location}</td><td>{row.service}</td><td>{row.bookedBy}</td><td>{row.source}</td><td><lightning-formatted-date-time value={row.startUtc} year="numeric" month="short" day="2-digit" hour="2-digit" minute="2-digit"></lightning-formatted-date-time></td><td><span class="status">{row.status}</span></td></tr></template></tbody></table></div>
                <div class="pagination"><lightning-button label="Previous" onclick={previousPage} disabled={previousDisabled}></lightning-button><span>{pageLabel}</span><lightning-button label="Next" onclick={nextPage} disabled={nextDisabled}></lightning-button></div>
            </template>
            <template lwc:else><p class="empty">Select a dashboard number, chart legend, or bar to view the matching appointments.</p></template>
        </section>
    </section>
</template>
