<template><section class="page"><header><div><p class="eyebrow">OPERATIONS</p><h1>Appointment Schedule</h1><p>Find, review and manage appointments from one workspace.</p></div><lightning-button label="Refresh" icon-name="utility:refresh" onclick={load}></lightning-button></header>
<div class="filters"><lightning-input type="search" label="Search appointments" value={searchTerm} onchange={changeSearch}></lightning-input><lightning-combobox label="Status" value={statusFilter} options={filterStatusOptions} onchange={changeStatusFilter}></lightning-combobox><lightning-combobox label="Date range" value={range} options={rangeOptions} onchange={changeRange}></lightning-combobox></div>
<div class="summary" aria-live="polite">Showing {filteredCount} of {totalCount} appointments</div><template lwc:if={error}><div class="error" role="alert">{error}</div></template><template lwc:if={loading}><lightning-spinner alternative-text="Loading appointments"></lightning-spinner></template><template lwc:elseif={hasRows}><div class="grid"><template for:each={filteredRows} for:item="r"><article key={r.id}><div class="card-heading"><h2>{r.subject}</h2><span class={r.statusClass}>{r.status}</span></div><p class="customer">{r.leadName}</p><p>{r.resourceName} · {r.locationName}</p><p class="date"><lightning-formatted-date-time value={r.startUtc} year="numeric" month="short" day="2-digit" weekday="short" hour="2-digit" minute="2-digit"></lightning-formatted-date-time></p><footer><lightning-button label="Details" data-id={r.id} data-action="details" onclick={open}></lightning-button><lightning-button label="Reschedule" data-id={r.id} data-action="reschedule" onclick={open}></lightning-button><lightning-button-menu alternative-text="More appointment actions" data-id={r.id} onselect={openMenu}><lightning-menu-item value="status" label="Update status"></lightning-menu-item><lightning-menu-item value="cancel" label="Cancel appointment"></lightning-menu-item></lightning-button-menu></footer></article></template></div></template><template lwc:else><div class="empty"><lightning-icon icon-name="utility:search" size="medium"></lightning-icon><h2>No matching appointments</h2><p>Change the filters or date range and try again.</p></div></template></section>
<template lwc:if={action}><section class="modal" role="dialog" aria-modal="true" aria-labelledby="appointment-dialog-heading"><div class="dialog"><h2 id="appointment-dialog-heading">{dialogTitle}</h2><template lwc:if={isDetails}><dl><div><dt>Customer</dt><dd>{selected.leadName}</dd></div><div><dt>Doctor / resource</dt><dd>{selected.resourceName}</dd></div><div><dt>Location</dt><dd>{selected.locationName}</dd></div><div><dt>Starts</dt><dd><lightning-formatted-date-time value={selected.startUtc} year="numeric" month="long" day="2-digit" weekday="long" hour="2-digit" minute="2-digit"></lightning-formatted-date-time></dd></div><div><dt>Ends</dt><dd><lightning-formatted-date-time value={selected.endUtc} hour="2-digit" minute="2-digit"></lightning-formatted-date-time></dd></div><div><dt>Status</dt><dd>{selected.status}</dd></div></dl></template><template lwc:if={isReschedule}><lightning-input type="date" label="New date" min={today} onchange={changeDate}></lightning-input><lightning-combobox name="time" label="Available time" options={slotOptions} value={time} onchange={change} required></lightning-combobox></template><template lwc:if={isCancel}><lightning-textarea name="reason" label="Cancellation reason" value={reason} onchange={change} required></lightning-textarea></template><template lwc:if={isStatus}><lightning-combobox name="status" label="Status" options={statusOptions} value={status} onchange={change}></lightning-combobox></template><footer><lightning-button label="Close" onclick={close}></lightning-button><template lwc:if={hasSaveAction}><lightning-button variant="brand" label="Save" disabled={saveDisabled} onclick={submit}></lightning-button></template></footer></div></section></template></template>
