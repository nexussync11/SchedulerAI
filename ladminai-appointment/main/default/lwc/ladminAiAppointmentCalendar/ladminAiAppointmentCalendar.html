<template>
    <section class="page" aria-labelledby="schedule-heading">
        <header class="page-header"><div><p class="eyebrow">Appointments</p><h1 id="schedule-heading" tabindex="-1">Appointment Schedule</h1><p>Search, review and manage every scheduled appointment.</p></div><div class="header-actions"><span class="timezone"><lightning-icon icon-name="utility:world" size="xx-small"></lightning-icon>Salesforce user timezone</span><lightning-button label="Refresh" icon-name="utility:refresh" onclick={load}></lightning-button></div></header>
        <div class="toolbar">
            <lightning-input type="search" label="Search" value={searchTerm} onchange={changeSearch}></lightning-input><lightning-combobox label="View" value={viewMode} options={viewOptions} data-field="viewMode" onchange={changeFilter}></lightning-combobox><lightning-input type="date" label="From" value={startDate} data-field="startDate" onchange={changeFilter}></lightning-input><lightning-input type="date" label="To" value={endDate} data-field="endDate" onchange={changeFilter}></lightning-input>
            <lightning-combobox label="Resource" value={resourceFilter} options={resourceOptions} data-field="resourceFilter" onchange={changeFilter}></lightning-combobox><lightning-combobox label="Location" value={locationFilter} options={locationOptions} data-field="locationFilter" onchange={changeFilter}></lightning-combobox><lightning-combobox label="Status" value={statusFilter} options={filterStatusOptions} data-field="statusFilter" onchange={changeFilter}></lightning-combobox><lightning-combobox label="Booked by" value={bookedByFilter} options={bookedByOptions} data-field="bookedByFilter" onchange={changeFilter}></lightning-combobox>
            <div class="toolbar-actions"><span class="result-count" aria-live="polite">{filteredCount} of {totalCount} appointments</span><lightning-button label="Apply dates" variant="brand-outline" onclick={load}></lightning-button><lightning-button label="Clear filters" onclick={resetFilters}></lightning-button></div>
        </div>
        <template lwc:if={error}><div class="state state_error" role="alert"><lightning-icon icon-name="utility:error" size="small"></lightning-icon><div><strong>Unable to load schedule</strong><p>{error}</p></div></div></template>
        <template lwc:if={loading}><div class="state" role="status"><lightning-spinner alternative-text="Loading appointment schedule" size="small"></lightning-spinner><span>Loading appointment schedule…</span></div></template>
        <template lwc:elseif={hasRows}><div class="schedule-card"><div class="schedule-header"><span>Appointment</span><span>Lead / customer</span><span>Resource</span><span>Location</span><span>Booked by</span><span>Date &amp; time</span><span>Status</span><span>Actions</span></div>
            <template for:each={filteredRows} for:item="r"><article class="schedule-row" key={r.id}><span class="appointment-cell"><strong>{r.subject}</strong><small>{r.name}</small></span><span>{r.leadName}</span><span>{r.resourceName}</span><span>{r.locationName}</span><span>{r.bookedBy}</span><span class="date-cell"><lightning-formatted-date-time value={r.startUtc} weekday="short" month="short" day="2-digit" hour="2-digit" minute="2-digit"></lightning-formatted-date-time><small><lightning-formatted-date-time value={r.endUtc} hour="2-digit" minute="2-digit"></lightning-formatted-date-time></small></span><span><span class={r.statusClass}>{r.status}</span></span><span class="row-actions"><lightning-button-icon icon-name="utility:preview" alternative-text="View appointment details" title="Details" data-id={r.id} data-action="details" onclick={open}></lightning-button-icon><lightning-button-icon icon-name="utility:date_input" alternative-text="Reschedule appointment" title="Reschedule" data-id={r.id} data-action="reschedule" onclick={open}></lightning-button-icon><lightning-button-menu alternative-text="More appointment actions" data-id={r.id} onselect={openMenu}><lightning-menu-item value="status" label="Update status"></lightning-menu-item><lightning-menu-item value="cancel" label="Cancel appointment"></lightning-menu-item></lightning-button-menu></span></article></template>
        </div></template>
        <template lwc:else><div class="state empty"><lightning-icon icon-name="utility:search" size="medium"></lightning-icon><div><strong>No appointments found</strong><p>Change the filters or date range and try again.</p></div></div></template>
    </section>
    <template lwc:if={action}><section class="modal" role="dialog" aria-modal="true" aria-labelledby="appointment-dialog-heading"><div class="dialog"><h2 id="appointment-dialog-heading">{dialogTitle}</h2>
        <template lwc:if={isDetails}><dl><div><dt>Customer</dt><dd>{selected.leadName}</dd></div><div><dt>Doctor / resource</dt><dd>{selected.resourceName}</dd></div><div><dt>Location</dt><dd>{selected.locationName}</dd></div><div><dt>Booked by</dt><dd>{selected.bookedBy}</dd></div><div><dt>Starts</dt><dd><lightning-formatted-date-time value={selected.startUtc} year="numeric" month="long" day="2-digit" weekday="long" hour="2-digit" minute="2-digit"></lightning-formatted-date-time></dd></div><div><dt>Ends</dt><dd><lightning-formatted-date-time value={selected.endUtc} hour="2-digit" minute="2-digit"></lightning-formatted-date-time></dd></div><div><dt>Status</dt><dd>{selected.status}</dd></div></dl></template>
        <template lwc:if={isReschedule}><lightning-combobox label="Location" value={rescheduleLocationId} options={rescheduleLocationOptions} onchange={changeRescheduleLocation} required></lightning-combobox><lightning-combobox label="Doctor / service resource" value={rescheduleResourceId} options={rescheduleResourceOptions} onchange={changeRescheduleResource} required></lightning-combobox><lightning-input type="date" label="New date" min={today} onchange={changeDate}></lightning-input><lightning-combobox name="time" label="Available time" options={slotOptions} value={time} onchange={change} required></lightning-combobox></template>
        <template lwc:if={isCancel}><lightning-textarea name="reason" label="Cancellation reason" value={reason} onchange={change} required></lightning-textarea></template><template lwc:if={isStatus}><lightning-combobox name="status" label="Status" options={statusOptions} value={status} onchange={change}></lightning-combobox></template>
        <footer><lightning-button label="Close" onclick={close}></lightning-button><template lwc:if={hasSaveAction}><lightning-button variant="brand" label="Save" disabled={saveDisabled} onclick={submit}></lightning-button></template></footer></div></section></template>
</template>
