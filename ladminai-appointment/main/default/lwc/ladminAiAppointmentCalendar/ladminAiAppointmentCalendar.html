<template><section class="page"><header><h1>Appointment Calendar</h1><lightning-button label="Refresh" onclick={load}></lightning-button></header><template lwc:if={error}><div class="error">{error}</div></template><template lwc:if={loading}><lightning-spinner alternative-text="Loading appointments"></lightning-spinner></template><template lwc:elseif={hasRows}><div class="grid"><template for:each={rows} for:item="r"><article key={r.id}><h2>{r.subject}</h2><p>{r.leadName}</p><p>{r.resourceName} · {r.locationName}</p><lightning-formatted-date-time value={r.startUtc} year="numeric" month="short" day="2-digit" hour="2-digit" minute="2-digit"></lightning-formatted-date-time><strong>{r.status}</strong><footer><lightning-button label="Reschedule" data-id={r.id} data-action="reschedule" onclick={open}></lightning-button><lightning-button label="Cancel" data-id={r.id} data-action="cancel" onclick={open}></lightning-button><lightning-button label="Update Status" data-id={r.id} data-action="status" onclick={open}></lightning-button></footer></article></template></div></template><template lwc:else><p>No appointments in this period.</p></template></section>
<template lwc:if={action}><section class="modal" role="dialog" aria-modal="true"><div class="dialog"><h2>Update Appointment</h2><template lwc:if={isReschedule}><lightning-input type="date" label="New date" onchange={changeDate}></lightning-input><lightning-combobox name="time" label="Available time" options={slotOptions} value={time} onchange={change}></lightning-combobox></template><template lwc:if={isCancel}><lightning-textarea name="reason" label="Cancellation reason" value={reason} onchange={change}></lightning-textarea></template><template lwc:if={isStatus}><lightning-combobox name="status" label="Status" options={statusOptions} value={status} onchange={change}></lightning-combobox></template><footer><lightning-button label="Close" onclick={close}></lightning-button><lightning-button variant="brand" label="Save" onclick={submit}></lightning-button></footer></div></section></template></template>
