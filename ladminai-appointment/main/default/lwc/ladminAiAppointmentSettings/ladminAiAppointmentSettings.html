<template><section><h1>Appointment Settings</h1><p>Scheduling calculations use the business timezone. Salesforce records continue storing DateTimes in UTC.</p><div class="readiness"><c-ladmin-ai-setup-readiness></c-ladmin-ai-setup-readiness></div><template lwc:if={error}><div class="error" role="alert">{error}</div></template><template lwc:if={loading}><lightning-spinner alternative-text="Loading settings"></lightning-spinner></template><div class="grid"><article><h2>Business timezone</h2><lightning-combobox label="Business timezone" value={businessTimezone} options={options} onchange={changeBusiness}></lightning-combobox><lightning-button variant="brand" label="Save Business Timezone" disabled={saving} onclick={saveBusiness}></lightning-button></article><article><h2>My display timezone</h2><lightning-combobox label="Salesforce display timezone" value={userTimezone} options={options} onchange={changeUser}></lightning-combobox><lightning-button label="Save My Timezone" disabled={saving} onclick={saveUser}></lightning-button></article><article><h2>Internal notifications</h2><p>Email the Salesforce user who booked an appointment when it is booked, rescheduled or cancelled. Lead/customer emails are not sent.</p><lightning-input type="toggle" label="Enable internal appointment emails" checked={internalNotificationsEnabled} onchange={changeNotifications}></lightning-input><lightning-button label="Save Notification Setting" disabled={saving} onclick={saveNotifications}></lightning-button></article></div></section></template>
