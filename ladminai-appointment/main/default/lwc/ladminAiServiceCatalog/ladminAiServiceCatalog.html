<template><section><header><div><p class="eyebrow">ADMINISTRATION</p><h1>Appointment Services</h1><p>Configure bookable services, durations and scheduling buffers.</p></div><div class="header-actions"><lightning-button label="Export CSV" icon-name="utility:download" onclick={exportCsv}></lightning-button><lightning-input type="file" label="Import CSV" accept=".csv,text/csv" onchange={importCsv}></lightning-input><lightning-button variant="brand" label="Add Service" onclick={create}></lightning-button></div></header><template lwc:if={error}><div class="error" role="alert">{error}</div></template><template lwc:if={hasImportErrors}><div class="import-errors" role="alert"><strong>Some rows were not imported</strong><ul><template for:each={importErrors} for:item="item"><li key={item}>{item}</li></template></ul></div></template><template lwc:if={loading}><lightning-spinner alternative-text="Loading services"></lightning-spinner></template><div class="grid"><template for:each={services} for:item="service"><article key={service.Id}><div><h2>{service.Name}</h2><span>{service.status}</span></div><p>{service.Description__c}</p><dl><div><dt>Duration</dt><dd>{service.Duration_Minutes__c} minutes</dd></div><div><dt>Buffer</dt><dd>{service.Buffer_Before_Minutes__c} before · {service.Buffer_After_Minutes__c} after</dd></div></dl><footer><lightning-button label="Edit" data-id={service.Id} onclick={edit}></lightning-button><lightning-button label={service.toggleLabel} data-id={service.Id} onclick={toggle}></lightning-button></footer></article></template></div><template lwc:if={empty}><div class="empty"><h2>No services configured</h2><p>Add the first service to replace free-text appointment types with governed scheduling rules.</p></div></template></section>
<template lwc:if={editing}><div class="modal" role="dialog" aria-modal="true" aria-labelledby="service-dialog"><div class="dialog"><h2 id="service-dialog">{dialogTitle}</h2><lightning-input name="name" label="Service name" value={draft.name} onchange={change} required></lightning-input><div class="numbers"><lightning-input name="duration" type="number" min="5" max="480" label="Duration (minutes)" value={draft.duration} onchange={change} required></lightning-input><lightning-input name="before" type="number" min="0" max="240" label="Buffer before" value={draft.before} onchange={change}></lightning-input><lightning-input name="after" type="number" min="0" max="240" label="Buffer after" value={draft.after} onchange={change}></lightning-input></div><lightning-textarea name="description" label="Description" value={draft.description} onchange={change}></lightning-textarea><lightning-input name="active" type="checkbox" label="Active" checked={draft.active} onchange={change}></lightning-input><footer><lightning-button label="Close" onclick={close}></lightning-button><lightning-button variant="brand" label="Save Service" onclick={save}></lightning-button></footer></div></div></template></template>
