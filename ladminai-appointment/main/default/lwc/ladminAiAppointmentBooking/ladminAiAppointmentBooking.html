<template>
    <section class="booking" aria-labelledby="booking-heading">
        <h2 id="booking-heading">Book Appointment</h2>
        <p>Select a location, resource, date, and an available time.</p>
        <template lwc:if={error}><div class="message error" role="alert">{error}</div></template>
        <template lwc:if={result}><div class="message success" role="status">Appointment {result.bookingReference} was booked successfully.</div></template>
        <template lwc:if={loading}><lightning-spinner alternative-text="Loading booking options"></lightning-spinner></template>
        <div class="form">
            <template lwc:if={needsLeadPicker}><lightning-record-picker label="Lead" object-api-name="Lead" onchange={handleLead} required></lightning-record-picker></template>
            <lightning-combobox label="Location" value={locationId} options={locationOptions} onchange={handleLocation} required></lightning-combobox>
            <lightning-combobox name="resourceId" label="Doctor or resource" value={resourceId} options={resourceOptions} onchange={handleInput} required></lightning-combobox>
            <lightning-input name="appointmentDate" type="date" label="Date" value={appointmentDate} min={minimumDate} onchange={handleInput} required></lightning-input>
            <lightning-input label="Subject" value={subject} onchange={handleSubject} required></lightning-input>
            <lightning-button label="Check Availability" onclick={checkAvailability} disabled={checkDisabled}></lightning-button>
            <lightning-combobox label="Available time" value={selectedSlot} options={slotOptions} onchange={handleSlot} required></lightning-combobox>
            <lightning-button variant="brand" label="Book Appointment" onclick={book} disabled={saveDisabled}></lightning-button>
        </div>
    </section>
</template>
