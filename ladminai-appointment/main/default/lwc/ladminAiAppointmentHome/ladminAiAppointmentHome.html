<template>
    <div class="app-shell">
        <aside class="sidebar" aria-label="LadminAI Smart Appointment navigation">
            <div class="brand">
                <img src={productLogo} alt="" />
                <div class="brand-copy"><strong>LadminAI</strong><span>Smart Appointments</span></div>
            </div>
            <nav>
                <template for:each={navigationItems} for:item="item">
                    <button key={item.id} class={item.className} data-view={item.id} aria-current={item.ariaCurrent} onclick={handleNavigate}>
                        <lightning-icon icon-name={item.icon} size="x-small" alternative-text=""></lightning-icon>
                        <span>{item.label}</span>
                    </button>
                </template>
            </nav>
            <button class="guide-link" onclick={openGuidance}><lightning-icon icon-name="utility:trail" size="xx-small" alternative-text=""></lightning-icon><span>Getting started guide</span></button>
            <div class="timezone">
                <lightning-icon icon-name="utility:world" size="xx-small" alternative-text=""></lightning-icon>
                <span>Business timezone<br /><strong>{businessTimezone}</strong></span>
            </div>
        </aside>
        <main class="workspace">
            <template lwc:if={showGuidance}>
                <section class="guidance" aria-labelledby="getting-started-heading">
                    <div class="guidance-heading"><div><p class="eyebrow">New here?</p><h2 id="getting-started-heading" tabindex="-1">Get started with Smart Appointments</h2><p>Follow these steps to configure and use scheduling.</p></div><lightning-button-icon icon-name="utility:close" alternative-text="Dismiss getting started guide" title="Dismiss guide" onclick={dismissGuidance}></lightning-button-icon></div>
                    <div class="guidance-steps">
                        <template lwc:if={canManageAdministration}>
                            <button data-view="settings" onclick={handleNavigate}><strong>1</strong><span>Set timezone</span></button>
                            <button data-view="locations" onclick={handleNavigate}><strong>2</strong><span>Add location</span></button>
                            <button data-view="resources" onclick={handleNavigate}><strong>3</strong><span>Add resource</span></button>
                            <button data-view="availability" onclick={handleNavigate}><strong>4</strong><span>Set hours, breaks &amp; blocked dates</span></button>
                        </template>
                        <template lwc:if={canManageAdministration}>
                            <button data-view="booking" onclick={handleNavigate}><strong>5</strong><span>Book appointment</span></button>
                            <button data-view="schedule" onclick={handleNavigate}><strong>6</strong><span>Manage schedule</span></button>
                            <button data-view="reports" onclick={handleNavigate}><strong>7</strong><span>Review reports</span></button>
                        </template>
                        <template lwc:else>
                            <button data-view="booking" onclick={handleNavigate}><strong>1</strong><span>Book appointment</span></button>
                            <button data-view="schedule" onclick={handleNavigate}><strong>2</strong><span>Manage schedule</span></button>
                            <button data-view="reports" onclick={handleNavigate}><strong>3</strong><span>Review reports</span></button>
                        </template>
                    </div>
                </section>
            </template>
            <template lwc:if={isHome}>
                <section class="page home">
                    <div class="hero">
                        <div><p class="eyebrow">LadminAI Smart Appointments</p><h1 tabindex="-1">Appointment Home</h1><p>Book appointments, review schedules and manage service-resource availability.</p></div>
                        <lightning-button variant="brand" label="Book appointment" data-view="booking" onclick={handleNavigate}></lightning-button>
                    </div>
                    <div class="home-grid">
                        <button class="feature-card" data-view="booking" onclick={handleNavigate}><lightning-icon icon-name="utility:event" size="small"></lightning-icon><strong>Appointment Booking</strong><span>Book a new appointment.</span></button>
                        <button class="feature-card" data-view="schedule" onclick={handleNavigate}><lightning-icon icon-name="utility:date_time" size="small"></lightning-icon><strong>Appointment Schedule</strong><span>Review and manage scheduled appointments.</span></button>
                        <template lwc:if={canManageAdministration}><button class="feature-card" data-view="availability" onclick={handleNavigate}><lightning-icon icon-name="utility:clock" size="small"></lightning-icon><strong>Resource Availability</strong><span>Maintain weekly schedules, breaks, holidays and date overrides.</span></button></template>
                    </div>
                    <section class="home-overview" aria-labelledby="home-overview"><h2 id="home-overview">Appointment overview</h2><c-ladmin-ai-appointment-dashboard></c-ladmin-ai-appointment-dashboard></section>
                </section>
            </template>
            <template lwc:elseif={isBooking}><c-ladmin-ai-appointment-booking record-id={bookingLeadId}></c-ladmin-ai-appointment-booking></template>
            <template lwc:elseif={isSchedule}><c-ladmin-ai-appointment-calendar></c-ladmin-ai-appointment-calendar></template>
            <template lwc:elseif={isAvailability}><c-ladmin-ai-availability-manager></c-ladmin-ai-availability-manager></template>
            <template lwc:elseif={isResources}><c-ladmin-ai-resource-directory></c-ladmin-ai-resource-directory></template>
            <template lwc:elseif={isServices}><c-ladmin-ai-service-catalog></c-ladmin-ai-service-catalog></template>
            <template lwc:elseif={isLocations}><c-ladmin-ai-location-directory></c-ladmin-ai-location-directory></template>
            <template lwc:elseif={isReports}><section class="page"><h1 tabindex="-1">Reports &amp; Dashboard</h1><p class="page-intro">Appointment analytics in one governed experience.</p><c-ladmin-ai-appointment-dashboard></c-ladmin-ai-appointment-dashboard></section></template>
            <template lwc:elseif={isInsights}><section class="page"><h1 tabindex="-1">AI Smart Insights</h1><p class="page-intro">Read-only operational recommendations generated from aggregated appointment metrics.</p><c-ladmin-ai-smart-insights></c-ladmin-ai-smart-insights></section></template>
            <template lwc:elseif={isHealth}><c-ladmin-ai-operational-health></c-ladmin-ai-operational-health></template>
            <template lwc:elseif={isSettings}><c-ladmin-ai-appointment-settings></c-ladmin-ai-appointment-settings></template>
        </main>
    </div>
</template>
